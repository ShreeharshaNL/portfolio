<!doctype html>
<html lang="en" class="dark scroll-smooth" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script>
      (function() {
        try {
          var urlParams = new URLSearchParams(window.location.search);
          var queryTheme = urlParams.get('theme');
          var stored = localStorage.getItem('shreeharsha-theme');
          var theme = (queryTheme === 'light' || queryTheme === 'dark') ? queryTheme : (stored === 'light' ? 'light' : 'dark');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.dataset.theme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.dataset.theme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    
    <!-- Primary Meta Tags -->
