<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#faf7f2" />
  <title>Resume | Shreeharsha N. L.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --canvas: #faf7f2;
      --surface: #ffffff;
      --surface-subtle: #f5eee5;
      --fg: #18181b;
      --muted: #71717a;
      --dim: #a1a1aa;
      --grid: rgba(80, 60, 45, 0.04);
      --accent: #e07a5f;
      --accent-hover: #cf6b50;
      --accent-teal: #4a7b87;
      --accent-light: rgba(224, 122, 95, 0.1);
      --border: #e8e0d5;
      --border-focus: #e07a5f;
      --shadow: 0 4px 20px -2px rgba(45, 35, 30, 0.06);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --canvas: #111620;
      --surface: #161d28;
      --surface-subtle: #1c2635;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --dim: #64748b;
      --grid: rgba(126, 195, 212, 0.05);
      --accent: #f49d85;
      --accent-hover: #faad98;
      --accent-teal: #7ec3d4;
      --accent-light: rgba(244, 157, 133, 0.12);
      --border: #222d3d;
      --border-focus: #f49d85;
      --shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--canvas);
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background-color: var(--canvas);
      background-image:
        radial-gradient(circle at 10% 20%, rgba(224, 122, 95, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(74, 123, 135, 0.08) 0%, transparent 40%),
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      background-position: center top;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(250, 247, 242, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    [data-theme="dark"] .topbar {
      background: rgba(17, 22, 32, 0.85);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: color 0.15s ease;
    }

    .brand:hover {
      color: var(--accent);
    }

    .brand-back {
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-icon {
      width: 34px;
      padding: 0;
    }

    .btn-primary {
      background: #e07a5f;
      border-color: #e07a5f;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(224, 122, 95, 0.25);
    }

    [data-theme="dark"] .btn-primary {
      background: #f49d85;
      border-color: #f49d85;
      color: #111620;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(244, 157, 133, 0.2);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #ffffff;
    }

    [data-theme="dark"] .btn-primary:hover {
      background: #faad98;
      border-color: #faad98;
      color: #111620;
    }

    .main {
      flex: 1;
      width: min(1120px, calc(100% - 48px));
      margin: 24px auto 36px;
    }

    .doc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .doc-meta {
      color: var(--dim);
      font-size: 11px;
    }

    .viewer-frame {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .pdf-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 170px);
      min-height: 640px;
      border: 0;
      background: #ffffff;
    }

    .footer-note {
      margin-top: 16px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.02em;
    }

    @media (max-width: 640px) {
      .topbar { padding: 0 16px; height: 56px; }
      .main { width: 100%; margin: 12px auto 20px; }
      .doc-header { padding: 0 16px; margin-bottom: 10px; }
      .viewer-frame { border-radius: 0; border-left: 0; border-right: 0; }
      .pdf-frame { height: calc(100vh - 140px); min-height: 480px; }
      .footer-note { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://shreeharsha.online" aria-label="Back to main portfolio">
      <span class="brand-back">←</span>
      <span>Shreeharsha N. L.</span>
    </a>

    <div class="actions">
      <button class="btn btn-icon" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
        </svg>
      </button>
      <a class="btn btn-primary" href="/resume.pdf" download="Shreeharsha-Resume.pdf">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Download PDF</span>
      </a>
    </div>
  </header>

  <main class="main">
    <div class="doc-header">
      <span class="status-badge">
        <span class="status-dot"></span>
        <span>Resume · PDF Document</span>
      </span>
      <span class="doc-meta">B.E. Information Science (NIE Mysuru) · Class of 2027</span>
    </div>

    <section class="viewer-frame" aria-label="Resume document viewer">
      <iframe class="pdf-frame" src="/resume.pdf#toolbar=1&navpanes=0&view=FitH" title="Shreeharsha's resume">
        Your browser cannot display PDFs inline.
        <a href="/resume.pdf" style="padding: 24px; display: block; color: var(--accent); text-align: center;">Click here to open the resume PDF directly.</a>
      </iframe>
    </section>

    <p class="footer-note">THE NATIONAL INSTITUTE OF ENGINEERING (NIE), MYSURU · CGPA 8.65 / 10.0</p>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");
    const metaTheme = document.querySelector('meta[name="theme-color"]');

    const sun = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>';
    const moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path>';

    function setTheme(theme) {
      root.dataset.theme = theme;
      const dark = theme === "dark";
      toggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      icon.innerHTML = dark ? sun : moon;
      metaTheme.setAttribute("content", dark ? "#111620" : "#faf7f2");
      try {
        localStorage.setItem("shreeharsha-theme", theme);
      } catch (e) {}
    }

    const savedTheme = (() => {
      try {
        return localStorage.getItem("shreeharsha-theme");
      } catch (e) {
        return null;
      }
    })();

    if (savedTheme === "dark" || savedTheme === "light") {
      setTheme(savedTheme);
    } else {
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      setTheme(prefersDark ? "dark" : "light");
    }

    toggle.addEventListener("click", () => {
      setTheme(root.dataset.theme === "dark" ? "light" : "dark");
    });
  </script>
</body>
</html>
