<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ll-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="ll-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#ll-bg)"/>
  <rect x="1" y="1" width="798" height="478" rx="15" fill="none" stroke="#232b3b" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#121824"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="400" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">LegalLens · AI Statutory Mapping System</text>

  <!-- Top App Navigation / Search Bar -->
  <rect x="30" y="60" width="740" height="52" rx="10" fill="#161c28" stroke="#263044" stroke-width="1"/>
  <circle cx="56" cy="86" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <line x1="62" y1="92" x2="68" y2="98" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <text x="82" y="91" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Landlord refusing security deposit refund after notice period...</text>
  <rect x="660" y="70" width="95" height="32" rx="6" fill="#f59e0b"/>
  <text x="707" y="90" fill="#0c0f14" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Analyze ↵</text>

  <!-- Left Panel: Classification & Confidence -->
  <rect x="30" y="130" width="310" height="315" rx="12" fill="#121722" stroke="#212a3d" stroke-width="1"/>
  <text x="50" y="160" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">DOMAIN CLASSIFICATION</text>
  <text x="50" y="190" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Tenancy & Contract Law</text>
  
  <rect x="50" y="215" width="270" height="50" rx="8" fill="#181f2e" stroke="#2a354c" stroke-width="1"/>
  <text x="65" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cosine Similarity Score</text>
  <text x="65" y="255" fill="#10b981" font-family="monospace" font-size="16" font-weight="700">0.914 · High Confidence</text>
  
  <rect x="50" y="280" width="270" height="60" rx="8" fill="#181f2e" stroke="#2a354c" stroke-width="1"/>
  <text x="65" y="302" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Primary Act Identified</text>
  <text x="65" y="325" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Transfer of Property Act, 1882</text>

  <!-- Multilingual Badges -->
  <text x="50" y="375" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Supported Locales:</text>
  <rect x="50" y="390" width="45" height="24" rx="4" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="72" y="406" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">EN</text>
  <rect x="105" y="390" width="45" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="127" y="406" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">HI</text>
  <rect x="160" y="390" width="45" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="182" y="406" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">KN</text>

  <!-- Right Panel: Matched Sections & Statutory Guidance -->
  <rect x="360" y="130" width="410" height="315" rx="12" fill="#121722" stroke="#212a3d" stroke-width="1"/>
  <text x="385" y="160" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">RETRIEVED STATUTORY SECTIONS</text>

  <!-- Section 108 Card -->
  <rect x="385" y="180" width="360" height="110" rx="8" fill="#181f2e" stroke="#2a354c" stroke-width="1"/>
  <text x="405" y="206" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">SECTION 108(b) · RIGHTS & LIABILITIES</text>
  <text x="405" y="230" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Obligation to return deposit upon vacant possession</text>
  <text x="405" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Notice period compliance verified: 30 days statutory duration.</text>
  <rect x="405" y="265" width="80" height="18" rx="3" fill="#10b981" opacity="0.15"/>
  <text x="445" y="278" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Active Match</text>

  <!-- Section 106 Card -->
  <rect x="385" y="305" width="360" height="95" rx="8" fill="#181f2e" stroke="#2a354c" stroke-width="1"/>
  <text x="405" y="330" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700">SECTION 106 · DURATION OF LEASES</text>
  <text x="405" y="352" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Legal termination notice requirements</text>
  <text x="405" y="372" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Applies to monthly residential and commercial tenancies.</text>

  <!-- Disclaimer Footer -->
  <text x="565" y="425" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle">Informational Legal Awareness Pipeline · Curated Knowledge Base</text>
</svg>
