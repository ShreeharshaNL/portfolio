<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="lw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1512"/>
      <stop offset="100%" stop-color="#060b09"/>
    </linearGradient>
    <linearGradient id="lw-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#lw-bg)"/>
  <rect x="1" y="1" width="798" height="478" rx="15" fill="none" stroke="#1b382b" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#0d1f19"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="400" y="26" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">LabelWise · AI Packaged Food OCR Scanner</text>

  <!-- Top Winner Banner -->
  <rect x="30" y="58" width="740" height="48" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
  <circle cx="60" cy="82" r="14" fill="#f59e0b" opacity="0.2"/>
  <path d="M55 77 L65 77 L63 85 L57 85 Z M53 74 L67 74 M57 85 L63 85 L60 90 Z" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="87" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Winner — NeoNexus 36.1 Hackathon at NIE Mysuru</text>
  <text x="740" y="87" fill="#6ee7b7" font-family="monospace" font-size="11" text-anchor="end">Team Code4Care</text>

  <!-- Left: OCR Camera Viewfinder Simulation -->
  <rect x="30" y="122" width="370" height="325" rx="12" fill="#0d1815" stroke="#1d382c" stroke-width="1"/>
  <text x="50" y="150" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">GOOGLE VISION OCR SCANNER</text>

  <!-- Camera Reticle & Bounding Boxes -->
  <rect x="50" y="168" width="330" height="210" rx="8" fill="#08100d" stroke="#132a21" stroke-width="1"/>
  <!-- Corner reticles -->
  <path d="M60 188 L60 178 L70 178" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M370 188 L370 178 L360 178" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M60 358 L60 368 L70 368" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M370 358 L370 368 L360 368" stroke="#10b981" stroke-width="2" fill="none"/>

  <!-- Simulated OCR detections with bounding boxes -->
  <rect x="75" y="195" width="280" height="32" rx="4" fill="#064e3b" opacity="0.4" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="85" y="215" fill="#f1f5f9" font-family="monospace" font-size="12">INGREDIENTS: REFINED FLOUR</text>

  <rect x="75" y="238" width="280" height="32" rx="4" fill="#78350f" opacity="0.4" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="85" y="258" fill="#fef3c7" font-family="monospace" font-size="12">PALM OIL · HYDROGENATED</text>
  <circle cx="340" cy="254" r="5" fill="#f59e0b"/>

  <rect x="75" y="280" width="280" height="32" rx="4" fill="#7f1d1d" opacity="0.4" stroke="#ef4444" stroke-width="1.5"/>
  <text x="85" y="300" fill="#fee2e2" font-family="monospace" font-size="12">INS 621 (MSG) · ADDED SUGAR 18g</text>
  <circle cx="340" cy="296" r="5" fill="#ef4444"/>

  <!-- OCR Status Bar -->
  <rect x="50" y="390" width="330" height="42" rx="6" fill="#0f261e" stroke="#1e4d3b" stroke-width="1"/>
  <circle cx="70" cy="411" r="4" fill="#10b981"/>
  <text x="85" y="415" fill="#a7f3d0" font-family="monospace" font-size="11">OCR Model: Google Cloud Vision API · 98.4% Acc</text>

  <!-- Right: Ingredient Health Analysis Breakdown -->
  <rect x="420" y="122" width="350" height="325" rx="12" fill="#0d1815" stroke="#1d382c" stroke-width="1"/>
  <text x="445" y="150" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">HEALTH RISK ANALYSIS</text>

  <!-- Risk Score Gauge -->
  <rect x="445" y="168" width="300" height="60" rx="8" fill="#13251f" stroke="#1d3d31" stroke-width="1"/>
  <text x="465" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Product Health Grade</text>
  <text x="465" y="215" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Moderate Caution · Score 48/100</text>

  <!-- Detected Additives List -->
  <rect x="445" y="240" width="300" height="52" rx="8" fill="#13251f" stroke="#78350f" stroke-width="1"/>
  <text x="465" y="260" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600">High Added Sugar (18.5g / serving)</text>
  <text x="465" y="278" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="10">Exceeds 35% of recommended daily threshold</text>

  <rect x="445" y="302" width="300" height="52" rx="8" fill="#13251f" stroke="#7f1d1d" stroke-width="1"/>
  <text x="465" y="322" fill="#f87171" font-family="monospace" font-size="11" font-weight="600">Flavor Enhancer INS 621 (Monosodium Glutamate)</text>
  <text x="465" y="340" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="10">Common allergy trigger for sensitive individuals</text>

  <!-- Consumer Guidance Tag -->
  <rect x="445" y="365" width="300" height="38" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="465" y="388" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11" font-weight="500">✓ Plain-Language Summary for Consumers</text>
</svg>
