<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e9e9e9" />
  <title>Resume | Shreeharsha</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #e9e9e9;
      --fg: #111111;
      --muted: #55585c;
      --grid: rgba(17, 17, 17, .075);
      --surface: #ffffff;
      --accent: #5db77d;
      --border: #111111;
      --shadow: 4px 4px 0 var(--border);
      --outline: #111111;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0c0f;
      --fg: #f5f5f5;
      --muted: #b7b9be;
      --grid: rgba(255, 255, 255, .075);
      --surface: #15161b;
      --accent: #5db77d;
      --border: #f1f1f1;
      --shadow: 4px 4px 0 #f1f1f1;
      --outline: #f1f1f1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 44px 44px;
      background-position: center top;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      border: 1.5px solid var(--outline);
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface);
      color: var(--fg);
      box-shadow: 2px 2px 0 var(--border);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .035em;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-mark {
      background: var(--accent);
      color: #111;
      padding: 8px 12px;
    }

    .brand-name { padding: 8px 13px; }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-button, .download {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 2px solid var(--outline);
      border-radius: 999px;
      background: var(--surface);
      color: var(--fg);
      box-shadow: 3px 3px 0 var(--border);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .icon-button { width: 44px; padding: 0; }
    .download {
      background: var(--accent);
      color: #111;
      padding: 0 17px;
    }

    .icon-button:hover, .download:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border);
    }

    .icon-button:focus-visible, .download:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .main {
      width: min(1180px, calc(100% - 56px));
      margin: 24px auto 44px;
    }

    .document-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 32px;
      border: 1.5px solid var(--outline);
      border-radius: 999px;
      padding: 5px 11px;
      background: var(--surface);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      border: 1px solid var(--fg);
    }

    .viewer {
      overflow: hidden;
      border: 2px solid var(--outline);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 6px 6px 0 var(--border);
    }

    .pdf {
      display: block;
      width: 100%;
      height: calc(100vh - 190px);
      min-height: 600px;
      border: 0;
      background: #fff;
    }

    .footnote {
      margin: 18px 2px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-align: center;
    }

    @media (max-width: 640px) {
      .topbar { height: 64px; padding: 0 16px; }
      .brand { font-size: 10px; }
      .brand-mark, .brand-name { padding: 7px 9px; }
      .actions { gap: 9px; }
      .icon-button { width: 40px; min-height: 40px; }
      .download { min-height: 40px; padding: 0 12px; font-size: 11px; }
      .main { width: 100%; margin: 14px auto 24px; }
      .document-heading { padding: 0 16px; margin-bottom: 12px; font-size: 10px; }
      .viewer { border-radius: 0; border-left: 0; border-right: 0; box-shadow: none; }
      .pdf { height: calc(100vh - 145px); min-height: 440px; }
      .footnote { padding: 0 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://shreeharsha.online" aria-label="Back to portfolio">
      <span class="brand-mark">08/27</span>
      <span class="brand-name">SHREEHAR­SHA</span>
    </a>

    <div class="actions">
      <button class="icon-button" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Toggle theme">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
        </svg>
      </button>
      <a class="download" href="/resume.pdf" download="Shreeharsha-Resume.pdf">
        <span aria-hidden="true">↓</span> DOWNLOAD
      </a>
    </div>
  </header>

  <main class="main">
    <div class="document-heading">
      <span class="status"><span class="status-dot"></span> RESUME / PDF</span>
      <span>SHREEHAR­SHA N. L.</span>
    </div>

    <section class="viewer" aria-label="Resume document">
      <iframe class="pdf" src="/resume.pdf#toolbar=1&navpanes=0&view=FitH" title="Shreeharsha's resume">
        Your browser cannot display PDFs inline.
        <a href="/resume.pdf">Open the resume PDF</a>.
      </iframe>
    </section>

    <p class="footnote">INFORMATION SCIENCE &amp; ENGINEERING · NIE MYSURU</p>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");
    const metaTheme = document.querySelector('meta[name="theme-color"]');

    const sun = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>';
    const moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path>';

    function setTheme(theme) {
      root.dataset.theme = theme;
      const dark = theme === "dark";
      toggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      icon.innerHTML = dark ? sun : moon;
      metaTheme.setAttribute("content", dark ? "#0b0c0f" : "#e9e9e9");
    }

    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(prefersDark ? "dark" : "light");

    toggle.addEventListener("click", () => {
      setTheme(root.dataset.theme === "dark" ? "light" : "dark");
    });
  </script>
</body>
</html>
